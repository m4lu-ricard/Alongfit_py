# Configuracao da analise do SonarCloud executada pelo pipeline.
sonar.sources=model,controller,view
sonar.tests=tests
sonar.python.version=3.13

# Relatorio de cobertura gerado pelo pytest-cov (pytest.ini).
sonar.python.coverage.reportPaths=coverage.xml

# A interface Tkinter (view/) e verificada manualmente e fica fora da meta de cobertura.
sonar.coverage.exclusions=view/**,tests/**
