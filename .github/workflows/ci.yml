name: CI

# Roda a cada push (em qualquer branch) e a cada pull request.
on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # Só pacotes já compilados (--only-binary) e com versão e hash conferidos
      # (--require-hashes), para nenhum script de instalação rodar no pipeline.
      - name: Instalar dependências travadas
        run: pip install --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Rodar os testes com cobertura
        run: pytest

      - name: Publicar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
